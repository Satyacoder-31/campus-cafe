services:
  - type: web
    name: campus-cafe-api
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false          # You'll enter this manually in Render dashboard
      - key: DATABASE_URL
        sync: false          # You'll enter this manually in Render dashboard
